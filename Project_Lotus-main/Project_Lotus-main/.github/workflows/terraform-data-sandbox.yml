name: Terraform — data-sandbox

on:
  push:
    branches: [main]
    paths:
      - 'accounts/data-sandbox/**'
      - 'project_lotus/project_lotus/preprocessing/**'
      - 'project_lotus/feature_engineering_emr/**'
      - 'project_lotus/sagemaker/jobs/**'
      - 'project_lotus/lambdas/**'
      - '.github/workflows/terraform-data-sandbox.yml'
      - '.github/workflows/build-and-push.yml'
      - '.github/workflows/build-and-push-autoencoder.yml'
      - '.github/workflows/deploy-feature-engineering.yml'

  pull_request:
    paths:
      - 'accounts/data-sandbox/**'
      - 'project_lotus/project_lotus/preprocessing/**'
      - 'project_lotus/feature_engineering_emr/**'
      - 'project_lotus/sagemaker/jobs/**'
      - 'project_lotus/lambdas/**'
      - '.github/workflows/terraform-data-sandbox.yml'
      - '.github/workflows/build-and-push.yml'
      - '.github/workflows/build-and-push-autoencoder.yml'
      - '.github/workflows/deploy-feature-engineering.yml'

  workflow_dispatch: {}

env:
  TF_VAR_emr_vpc_id:     ${{ vars.EMR_VPC_ID }}
  TF_VAR_emr_subnet_ids: ${{ vars.EMR_SUBNET_IDS }}
  AWS_REGION:    ca-central-1
  AWS_ACCOUNT_ID: "162591926854"

jobs:

  # ------------------------------------------------------------
  # Detect exactly which part of the pipeline changed.
  # ------------------------------------------------------------
  detect-changes:
    name: Detect pipeline changes
    runs-on: ubuntu-latest
    outputs:
      preprocessing_changed: ${{ steps.flags.outputs.preprocessing_changed }}
      feature_engineering_changed: ${{ steps.flags.outputs.feature_engineering_changed }}
      training_changed: ${{ steps.flags.outputs.training_changed }}
      inference_changed: ${{ steps.flags.outputs.inference_changed }}
      infra_changed: ${{ steps.flags.outputs.infra_changed }}
      security_changed: ${{ steps.flags.outputs.security_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate change flags
        id: flags
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BASE=""
            HEAD=""
          else
            BASE="$BEFORE_SHA"
            HEAD="$CURRENT_SHA"
          fi

          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base commit; enabling all flags."
            FILES=""
            FORCE_ALL=true
          else
            FILES="$(git diff --name-only "$BASE" "$HEAD")"
            FORCE_ALL=false
          fi

          echo "Changed files:"
          printf '%s\n' "$FILES"

          preprocessing_changed=false
          feature_engineering_changed=false
          training_changed=false
          inference_changed=false
          infra_changed=false
          security_changed=false

          if [[ "$FORCE_ALL" == "true" ]]; then
            preprocessing_changed=true
            feature_engineering_changed=true
            training_changed=true
            inference_changed=true
            infra_changed=true
            security_changed=true
          else
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              case "$file" in
                project_lotus/project_lotus/preprocessing/*)
                  preprocessing_changed=true
                  # Preserve the current behavior: preprocessing changes
                  # also cause Terraform deployment.
                  infra_changed=true
                  ;;
                project_lotus/feature_engineering_emr/*)
                  feature_engineering_changed=true
                  # Feature engineering artifact changes also deploy via Terraform
                  infra_changed=true
                  ;;
                project_lotus/sagemaker/jobs/training/*)
                  training_changed=true
                  ;;
                project_lotus/sagemaker/jobs/inference/*)
                  inference_changed=true
                  ;;
               
                accounts/data-sandbox/infra/*)
                  infra_changed=true
                  ;;
                accounts/data-sandbox/security/*)
                  security_changed=true
                  ;;
                project_lotus/lambdas/*)
                  infra_changed=true
                  ;;
                .github/workflows/terraform-data-sandbox.yml|\
                .github/workflows/build-and-push.yml|\
                .github/workflows/build-and-push-autoencoder.yml|\
                .github/workflows/deploy-feature-engineering.yml)
                  # Workflow changes can alter pipeline behavior, so run
                  # all relevant components rather than making assumptions.
                  preprocessing_changed=true
                  feature_engineering_changed=true
                  training_changed=true
                  inference_changed=true
                  infra_changed=true
                  security_changed=true
                  ;;
              esac
            done <<< "$FILES"
          fi

          echo "preprocessing_changed=$preprocessing_changed" >> "$GITHUB_OUTPUT"
          echo "feature_engineering_changed=$feature_engineering_changed" >> "$GITHUB_OUTPUT"
          echo "training_changed=$training_changed" >> "$GITHUB_OUTPUT"
          echo "inference_changed=$inference_changed" >> "$GITHUB_OUTPUT"
          echo "infra_changed=$infra_changed" >> "$GITHUB_OUTPUT"
          echo "security_changed=$security_changed" >> "$GITHUB_OUTPUT"

          echo "preprocessing_changed=$preprocessing_changed"
          echo "feature_engineering_changed=$feature_engineering_changed"
          echo "training_changed=$training_changed"
          echo "inference_changed=$inference_changed"
          echo "infra_changed=$infra_changed"
          echo "security_changed=$security_changed"

  # ------------------------------------------------------------
  # Terraform — Security
  # Only runs when security configuration changed.
  # ------------------------------------------------------------
  security:
    needs: detect-changes
    if: ${{ needs['detect-changes'].outputs.security_changed == 'true' }}
    uses: dev/terraform-actions/.github/workflows/terraform.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment:       data-sandbox-security
      working_directory: accounts/data-sandbox/security
      terraform_version: "1.15.8"

  # ------------------------------------------------------------
  # Terraform — Infrastructure
  # Lambda source is packaged by Terraform, so Lambda changes run here even
  # when no .tf file changed. Workflow path filters select this workflow;
  # do not apply another source-output gate before calling Terraform.
  # ------------------------------------------------------------
  infra:
    needs: [detect-changes, security]
    if: ${{ always() && (needs.security.result == 'success' || needs.security.result == 'skipped') }}
    uses: dev/terraform-actions/.github/workflows/terraform.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment:       data-sandbox-infra
      working_directory: accounts/data-sandbox/infra
      terraform_version: "1.15.8"

  # ------------------------------------------------------------
  # Build and Push Preprocessing Docker Image
  # ------------------------------------------------------------
  build-and-push:
    needs: detect-changes
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.preprocessing_changed == 'true'
    uses: ./.github/workflows/build-and-push.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment:    data-sandbox-infra
      aws_region:     ca-central-1
      ecr_repository: lotus-sandbox-preprocessing
      aws_account_id: "162591926854"

  # ------------------------------------------------------------
  # Build and Push Autoencoder Images
  # Pass independent flags so training and inference can run
  # independently.
  # ------------------------------------------------------------
  build-and-push-autoencoder:
    needs: detect-changes
    if: github.event_name != 'pull_request' && (needs.detect-changes.outputs.training_changed == 'true' || needs.detect-changes.outputs.inference_changed == 'true')
    uses: ./.github/workflows/build-and-push-autoencoder.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: data-sandbox-infra
      aws_region: ca-central-1
      TRAINING_ECR_REPOSITORY: lotus-sandbox-model_autoencoder_training
      INFERENCE_ECR_REPOSITORY: lotus-sandbox-model_autoencoder_inference
      aws_account_id: "162591926854"
      run_training: ${{ needs.detect-changes.outputs.training_changed == 'true' }}
      run_inference: ${{ needs.detect-changes.outputs.inference_changed == 'true' }}

  # ------------------------------------------------------------
  # Deploy Feature Engineering EMR Artifacts to S3
  # ------------------------------------------------------------
  deploy-feature-engineering:
    needs: [detect-changes, security]
    if: ${{ always() && github.event_name != 'pull_request' && needs.detect-changes.outputs.feature_engineering_changed == 'true' && (needs.security.result == 'success' || needs.security.result == 'skipped') }}
    uses: ./.github/workflows/deploy-feature-engineering.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment:    data-sandbox-infra
      aws_region:     ca-central-1
      target_s3_uri:  s3://lotus-sandbox-ml-preprocessing-data/pp_prod_artifacts/
      aws_account_id: "162591926854"
