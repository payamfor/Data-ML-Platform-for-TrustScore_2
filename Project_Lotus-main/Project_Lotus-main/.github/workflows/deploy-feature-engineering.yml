name: Deploy — Feature Engineering EMR Artifacts

# Push-triggered runs come from terraform-data-sandbox.yml, which calls this
# workflow. The AWS role only trusts refs/heads/main, so run it from main.
on:
  workflow_dispatch:
    inputs:
      target_s3_uri:
        description: "Target S3 URI prefix"
        required: false
        default: "s3://lotus-sandbox-ml-preprocessing-data/pp_prod_artifacts/"

  workflow_call:
    inputs:
      environment:
        description: "GitHub environment name."
        type: string
        required: false
        default: data-sandbox-infra

      aws_region:
        description: "AWS region where target S3 bucket lives."
        type: string
        required: false
        default: ca-central-1

      target_s3_uri:
        description: "Target S3 URI prefix."
        type: string
        required: false
        default: "s3://lotus-sandbox-ml-preprocessing-data/pp_prod_artifacts/"

      aws_account_id:
        description: "AWS account ID that owns the S3 bucket."
        type: string
        required: false
        default: "162591926854"

      role_to_assume:
        description: "IAM role to assume via GitHub OIDC."
        type: string
        required: false
        default: "arn:aws:iam::162591926854:role/lotus-sandbox-fe-artifacts-deploy-role"

env:
  AWS_REGION: ca-central-1
  AWS_ACCOUNT_ID: "162591926854"
  TARGET_S3_URI: "s3://lotus-sandbox-ml-preprocessing-data/pp_prod_artifacts/"
  DEFAULT_ROLE_TO_ASSUME: "arn:aws:iam::162591926854:role/lotus-sandbox-fe-artifacts-deploy-role"

jobs:

  package-and-deploy:
    name: Package & deploy feature engineering artifacts
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'data-sandbox-infra' }}

    permissions:
      id-token: write
      contents: read

    steps:

      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # AWS OIDC authentication (no static keys)
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume || env.DEFAULT_ROLE_TO_ASSUME }}
          role-session-name: github-fe-deploy-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region || env.AWS_REGION }}

      # ---------------------------------------------------------
      # Setup Python environment
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: project_lotus/feature_engineering_emr/requirements.txt

      # ---------------------------------------------------------
      # Install packaging & testing dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
          if [ -f project_lotus/feature_engineering_emr/requirements.txt ]; then
            pip install -r project_lotus/feature_engineering_emr/requirements.txt
          fi

      # ---------------------------------------------------------
      # Package the code into dist/ using package.sh
      # ---------------------------------------------------------
      - name: Package artifacts
        run: |
          chmod +x project_lotus/feature_engineering_emr/scripts/package.sh
          cd project_lotus/feature_engineering_emr
          ./scripts/package.sh

      # ---------------------------------------------------------
      # Verify generated artifacts before deployment
      # ---------------------------------------------------------
      - name: Validate built artifacts
        run: |
          DIST="project_lotus/feature_engineering_emr/dist"
          echo "Checking artifact contents in $DIST..."

          test -f "$DIST/ts05_features.zip" || (echo "ERROR: ts05_features.zip missing" && exit 1)
          test -f "$DIST/pydeps.zip" || (echo "ERROR: pydeps.zip missing" && exit 1)
          test -f "$DIST/feature_engineering_job.py" || (echo "ERROR: feature_engineering_job.py missing" && exit 1)
          test -f "$DIST/conf/base.yaml" || (echo "ERROR: conf/base.yaml missing" && exit 1)
          test -f "$DIST/conf/sandbox.yaml" || (echo "ERROR: conf/sandbox.yaml missing" && exit 1)

          echo "All expected artifacts verified successfully."

      # ---------------------------------------------------------
      # Deploy artifacts to target S3 prefix
      # ---------------------------------------------------------
      - name: Deploy to S3
        env:
          S3_DEST: ${{ inputs.target_s3_uri || env.TARGET_S3_URI }}
        run: |
          DIST="project_lotus/feature_engineering_emr/dist"
          echo "Syncing $DIST to $S3_DEST..."
          aws s3 sync "$DIST/" "${S3_DEST%/}/" --delete --region "${{ inputs.aws_region || env.AWS_REGION }}"

      # ---------------------------------------------------------
      # Verify S3 destination
      # ---------------------------------------------------------
      - name: Confirm S3 artifact availability
        env:
          S3_DEST: ${{ inputs.target_s3_uri || env.TARGET_S3_URI }}
        run: |
          echo "Listing artifacts at $S3_DEST:"
          aws s3 ls "${S3_DEST%/}/" --recursive --region "${{ inputs.aws_region || env.AWS_REGION }}"
